syntax = "proto3"; 
import "common.proto";

message HubCreatePlayerEntity {
  string conn_id = 1;
  string user_id = 2;
  string entity_id = 3;
  string entity_type = 4;
  bytes argv = 5;
}

message HubCreateRemoteEntity {
  string conn_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  bytes argv = 4;
}
 
message HubDeleteRemoteEntity {
  string conn_id = 1;
  string entity_id = 2;
}

message HubRefreshEntity {
  string conn_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  bytes argv = 4;
}

message GateForwardHubRequestClient {
  string conn_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message GateForwardHubResponseClient {
  string conn_id = 1;
  string entity_id = 2;
  string errMsg = 3;
  bytes content = 4;
}

message GateForwardHubNotifyClient {
  string conn_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message GateForwardHubNotifyClientMq {
  string user_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
  // 可靠消息的唯一序号：hub 投递时赋值（重投沿用同一份消息所以序号不变），
  // gate 用它校验客户端 ack 的是不是队头那一条，并原样转给客户端的 HubNotifyClientMq
  uint64 seq = 4;
}

message GateForwardHubCallGlobal {
  string entity_id = 1;
  CallRpc event = 2;
}

message HubKickOffClient {
  string conn_id = 1;
  string prompt_info = 2;
}
