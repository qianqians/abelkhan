syntax = "proto3"; 
import "common.proto";

message HubCreatePlayerEntity {
  string conn_id = 1;
  string user_id = 2;
  string entity_id = 3;
  string entity_type = 4;
  bytes argv = 5;
}

message HubCreateRemoteEntity {
  repeated string conn_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  bytes argv = 4;
}
 
message HubDeleteRemoteEntity {
  repeated string conn_id = 1;
  string entity_id = 2;
}

message HubRefreshEntity {
  repeated string conn_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  bytes argv = 4;
}

message GateForwardHubRequestClient {
  string conn_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message GateForwardHubResponseClient {
  string conn_id = 1;
  string entity_id = 2;
  string errMsg = 3;
  bytes content = 4;
}

message GateForwardHubNotifyClient {
  repeated string conn_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message GateForwardHubNotifyClientMq {
  string user_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message GateForwardHubCallGlobal {
  string entity_id = 1;
  CallRpc event = 2;
}

message HubKickOffClient {
  string conn_id = 1;
  string prompt_info = 2;
}
