syntax = "proto3"; 
import "common.proto";

message CreatePlayerEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes argv = 3;
}

message CreateRemoteEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes argv = 3;
}

message DeleteRemoteEntity {
  string entity_id = 1;
}

message RefreshEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes argv = 3;
}

message NotifyConnID {
  string conn_id = 1;
}

message HubRequestClient {
  string entity_id = 1;
  CallRpc event = 2;
}

message HubResponseClient {
  string errMsg = 1;
  bytes content = 2;
}

message HubNotifyClient {
  string entity_id = 1;
  CallRpc event = 2;
}

message HubNotifyClientMq {
  string entity_id = 1;
  CallRpc event = 2;
  bool need_ack = 3;
  // 可靠消息的唯一序号（hub 投递时赋值，超时重投保持不变）。
  // 客户端收到后原样回填到 AckReliabilityMsg.seq，gate 靠它判断这条 ack
  // 确认的是不是 Redis 队头那一条，从而让重复 ack 被忽略而不是误弹出下一条。
  uint64 seq = 4;
}

message KickOff {
  string prompt_info = 1;
}

// 客户端请求领取邮件：
//   mail_id 为空   -> 返回当前可领取的全局邮件（不标记领取）
//   mail_id 非空   -> 领取指定邮件（标记为已领取并返回）
message ClientRequestMail {
  string mail_id = 1;
}

message ClientRequestMailResult {
  repeated MailInfo mails = 1;
}

// ============================================================
// 商城（氪金商城 + 玩家寄拍 + 限时拍卖）
// ============================================================

// 售卖模式：一口价 / 限时拍卖
enum ShopSaleMode {
  SHOP_SALE_MODE_UNKNOWN = 0;
  SHOP_SALE_MODE_FIXED = 1;
  SHOP_SALE_MODE_AUCTION = 2;
}

// 商品来源：官方（admin 上架）/ 玩家寄拍
enum ShopSource {
  SHOP_SOURCE_UNKNOWN = 0;
  SHOP_SOURCE_OFFICIAL = 1;
  SHOP_SOURCE_PLAYER = 2;
}

// 物品/货币的发放条目
message ShopItemGrant {
  string item_id = 1;
  int64 count = 2;
}

// 一条在售商品（官方商品或玩家寄拍）
message ShopListingInfo {
  string listing_id = 1;
  ShopSource source = 2;
  string seller_id = 3;          // 玩家寄拍的卖家；官方商品为空
  string product_id = 4;         // 官方商品配置 id；玩家寄拍为空
  string title = 5;
  string description = 6;
  string icon = 7;
  string category = 8;
  ShopSaleMode sale_mode = 9;
  string currency_item_id = 10;  // 结算货币（也是背包里的物品 id）
  int64 price = 11;              // 一口价（单个）
  int64 start_price = 12;        // 拍卖起拍价
  int64 min_increment = 13;      // 拍卖最小加价
  int64 current_price = 14;      // 拍卖当前最高价（无出价时为 0）
  string top_bidder_id = 15;     // 拍卖当前最高出价人
  int32 stock = 16;              // 一口价剩余库存，-1 = 不限
  repeated ShopItemGrant items = 17; // 一份商品包含的物品
  uint64 start_time = 18;        // 上架时间（Unix 毫秒）
  uint64 end_time = 19;          // 结束时间（Unix 毫秒，0 = 不限时）
  string status = 20;            // active / sold / expired / cancelled
  int32 per_user_limit = 21;     // 每人限购，0 = 不限
  int32 my_purchased = 22;       // 当前玩家已购买数量
  uint64 server_time = 23;       // 服务器时间，用于客户端倒计时校准
}

message ClientShopList {
  string category = 1;
  ShopSource source = 2;         // UNKNOWN = 全部
  bool mine = 3;                 // 只看我寄拍的
  uint32 page = 4;
  uint32 page_size = 5;
}

message ClientShopListResult {
  repeated ShopListingInfo listings = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  string currency_item_id = 5;   // 默认氪金货币
  uint64 server_time = 6;
  uint32 pending_deliveries = 7; // 待领取的寄拍/拍卖结算数量
}

message ClientShopBuy {
  string listing_id = 1;
  uint32 count = 2;              // 一口价购买份数，默认 1
}

message ClientShopBuyResult {
  ShopListingInfo listing = 1;
  repeated ShopItemGrant delivered = 2; // 本次真正放进背包的物品
  string message = 3;
}

message ClientShopBid {
  string listing_id = 1;
  int64 price = 2;               // 我的出价总额
}

message ClientShopBidResult {
  ShopListingInfo listing = 1;
  int64 required = 2;            // 本次实际扣款（自己顶价时只补差价）
}

message ClientShopConsign {
  string item_id = 1;
  uint32 count = 2;
  ShopSaleMode sale_mode = 3;
  int64 price = 4;               // 一口价总价
  int64 start_price = 5;         // 拍卖起拍价
  int64 min_increment = 6;       // 拍卖最小加价
  uint32 duration_seconds = 7;   // 0 = 服务端默认
  string title = 8;
  string description = 9;
}

message ClientShopConsignResult {
  ShopListingInfo listing = 1;
}

message ClientShopCancel {
  string listing_id = 1;
}

message ClientShopCancelResult {
  ShopListingInfo listing = 1;
}

message ClientShopClaim {
}

message ClientShopClaimResult {
  repeated ShopItemGrant granted = 1;
  string message = 2;
}

// ============================================================
// 排行榜（Redis ZSET，hub 侧）
// ============================================================

// 打榜：仅保留最高分（新分低于历史最高分时不更新）
message ClientLeaderboardSubmit {
  string board_id = 1;
  double score = 2;
}

message ClientLeaderboardSubmitResult {
  uint32 rank = 1;          // 打榜后的名次，1-based；0 = 不在榜
  double score = 2;         // 当前榜上的分数（可能是历史最高分）
}

// 一条榜单条目
message ClientLeaderboardEntry {
  string member_id = 1;
  uint32 rank = 2;          // 1-based 名次
  double score = 3;
  string display_name = 4;  // 游戏钩子填充，可为空
  string avatar = 5;        // 游戏钩子填充，可为空
}

// 拉取 [start, end) 名次区间（start 0-based，end 不包含）
message ClientLeaderboardRange {
  string board_id = 1;
  uint32 start = 2;
  uint32 end = 3;
}

message ClientLeaderboardRangeResult {
  repeated ClientLeaderboardEntry entries = 1;
  uint32 total = 2;         // 榜单总人数
}

// 查询名次（member_id 空 = 查自己）
message ClientLeaderboardRank {
  string board_id = 1;
  string member_id = 2;
}

message ClientLeaderboardRankResult {
  ClientLeaderboardEntry entry = 1;  // rank = 0 表示不在榜
}

// ============================================================
// 好友系统（hub 侧）
// ============================================================

// 一条好友 / 申请条目
message ClientFriendInfo {
  string user_id = 1;
  bool online = 2;            // 在线状态（来自 presence）
  string display_name = 3;    // 游戏钩子填充，可为空
  string avatar = 4;          // 游戏钩子填充，可为空
}

// 拉取好友列表
message ClientFriendList {
}

message ClientFriendListResult {
  repeated ClientFriendInfo friends = 1;
  uint32 max_friends = 2;     // 全局默认上限
  uint32 extra_friends = 3;   // 本玩家额外好友位
  uint32 used = 4;            // 已用 = 好友数 + 临时占位
}

// 拉取待处理的好友申请（= 离线消息）
message ClientFriendRequests {
}

message ClientFriendRequestsResult {
  repeated ClientFriendInfo requests = 1;
}

// 发起好友申请（对方离线时作为离线消息保留，上线后处理）
message ClientFriendSendRequest {
  string user_id = 1;
}

message ClientFriendSendRequestResult {
  bool pending = 1;           // true = 已写入对方的待处理申请
}

// 同意好友申请：占位 -> 跨服确认 -> 回执
message ClientFriendAccept {
  string user_id = 1;         // 申请方
}

message ClientFriendAcceptResult {
  ClientFriendInfo friend = 1;
}

// 拒绝好友申请
message ClientFriendReject {
  string user_id = 1;
}

message ClientFriendRejectResult {
}

// 删除好友（双向解除）
message ClientFriendRemove {
  string user_id = 1;
}

message ClientFriendRemoveResult {
}

// ---- 下面都是 hub 主动推给客户端的通知 ----

// 收到好友申请 / 上线时拉到的待处理申请
message ClientFriendRequestNotify {
  ClientFriendInfo from = 1;
}

// 好友上线 / 下线
message ClientFriendOnlineNotify {
  string user_id = 1;
}

message ClientFriendOfflineNotify {
  string user_id = 1;
}

// 加好友成功 / 被对方删除
message ClientFriendAddedNotify {
  string user_id = 1;
}

message ClientFriendRemovedNotify {
  string user_id = 1;
}

// 加好友超时（临时占位被回收）
message ClientFriendAcceptTimeoutNotify {
  string user_id = 1;
}

// ============================================================
// 聊天（频道群发 + 点对点）
// ============================================================

// 一条聊天消息（频道消息 / 私聊共用）
message ClientChatEntry {
  string message_id = 1;
  string channel_id = 2;     // 私聊时为空
  string sender_id = 3;
  string sender_name = 4;    // 发送时冗余，接收方不用再解析
  string sender_avatar = 5;
  string content = 6;
  uint64 send_time = 7;      // Unix 毫秒
}

// 频道元信息
message ClientChatChannelInfo {
  string channel_id = 1;
  string name = 2;
  int32 scope = 3;           // 对应 chat.ChatScope
  uint32 cooldown_ms = 4;
  uint32 history_count = 5;
}

// 可用频道列表
message ClientChatChannels {
}

message ClientChatChannelsResult {
  repeated ClientChatChannelInfo channels = 1;
}

// 频道发言
message ClientChatSend {
  string channel_id = 1;
  string content = 2;
}

message ClientChatSendResult {
  ClientChatEntry entry = 1;
}

// 拉频道历史（服务端自己解析该玩家在该频道的作用域）
message ClientChatHistory {
  string channel_id = 1;
  uint32 count = 2;          // 0 = 服务端默认上限
}

message ClientChatHistoryResult {
  repeated ClientChatEntry entries = 1;  // 时间正序
}

// 点对点私聊（不限好友，仅在线）
message ClientChatPrivate {
  string to_user_id = 1;
  string content = 2;
}

message ClientChatPrivateResult {
  ClientChatEntry entry = 1;
}

// 收到频道消息
message ClientChatMessageNotify {
  ClientChatEntry entry = 1;
}

// 收到私聊消息
message ClientChatPrivateNotify {
  ClientChatEntry entry = 1;
}