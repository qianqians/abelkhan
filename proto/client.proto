syntax = "proto3"; 
import "common.proto";

// ============================================================
// 客户端实体的生命周期 / hub 与客户端之间的传输信封
//
// 各功能协议分别在对应文件里：
//   bag.proto         背包
//   mail.proto        邮件
//   shop.proto        商城
//   leaderboard.proto 排行榜
//   friend.proto      好友
//   chat.proto        聊天
//   guild.proto       帮会 / 联盟
//   quest.proto       任务
// ============================================================

message CreatePlayerEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes argv = 3;
}

message CreateRemoteEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes argv = 3;
}

message DeleteRemoteEntity {
  string entity_id = 1;
}

message RefreshEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes argv = 3;
}

message NotifyConnID {
  string conn_id = 1;
}

message HubRequestClient {
  string entity_id = 1;
  CallRpc event = 2;
}

message HubResponseClient {
  string errMsg = 1;
  bytes content = 2;
}

message HubNotifyClient {
  string entity_id = 1;
  CallRpc event = 2;
}

message HubNotifyClientMq {
  string entity_id = 1;
  CallRpc event = 2;
  bool need_ack = 3;
  // 可靠消息的唯一序号（hub 投递时赋值，超时重投保持不变）。
  // 客户端收到后原样回填到 AckReliabilityMsg.seq，gate 靠它判断这条 ack
  // 确认的是不是 Redis 队头那一条，从而让重复 ack 被忽略而不是误弹出下一条。
  uint64 seq = 4;
}

message KickOff {
  string prompt_info = 1;
}
