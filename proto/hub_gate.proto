syntax = "proto3"; 
import "common.proto";

message GateForwardClientRequestReconnect {
  string gate_name = 1;
  string conn_id = 2;
  string user_id = 3;
  bytes argv = 4;
}

message GateForwardClientRequestService {
  string service_name = 1;
  string gate_name = 2;
  string conn_id = 3;
  bytes argv = 4;
}

message ClientDisconnect {
  string conn_id = 1;
  // 下线玩家的 user_id；gate 在剔除心跳超时连接时填充，
  // hub 据此给好友推送下线事件（为空则只打日志）。
  string user_id = 2;
  string entity_id = 3;
}

message ClientRequestHub {
  string conn_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message ClientResponseHub {
  string entity_id = 1;
  string errMsg = 2;
  bytes content = 3;
}

message ClientNotifyHub {
  string conn_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}
