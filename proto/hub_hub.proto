syntax = "proto3"; 
import "common.proto";

// ============================================================
// hub ↔ hub 通道的**通用**消息。
//
// 约定（和 bag/mail/shop/... 一致的功能优先拆分）：
//   某个功能专用的跨 hub 消息放回它自己的 proto 里 ——
//   FriendConfirmAdd / FriendConfirmAddResult → friend.proto
//   ChatBroadcast                             → chat.proto
// 这里只留不属于任何单个功能的通道级消息。
// ============================================================

message HubHubNotifyEntity {
  string src_hub_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}
