syntax = "proto3"; 
import "common.proto";

message ClientRequestReconnect {
	string user_id = 1;
	bytes argv = 2;
}

message ClientRequestService {
	string service_name = 1;
	bytes argv = 2;
}

message GateForwardClientRequestHub {
  string msg_id = 1;
  string entity_id = 2;
  CallRpc event = 3;
}

message GateForwardClientResponseHub {
  string msg_id = 1;
  string entity_id = 2;
  string err_msg = 3;
  bytes content = 4;
}

message GateForwardClientNotifyHub {
  string entity_id = 1;
  CallRpc event = 2;
}

message VersionHandshake {
  uint32 min_version = 1;
  uint32 max_version = 2;
}

// 客户端确认收到可靠消息。gate 靠 seq 判断这条 ack 确认的是不是 Redis 队头那一条；
// seq 为 0 时退回按 entity_id 比对。
message AckReliabilityMsg {
  string entity_id = 1;
  // 客户端把收到的 HubNotifyClientMq.seq 原样回填
  uint64 seq = 2;
}