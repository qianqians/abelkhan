syntax = "proto3"; 

message CallRpc {
  string proto_name = 1;
  bytes content = 2;
}

message HeartBeats {
}

message Request {
  string msg_id = 1;
  CallRpc event = 2;
}

message Response {
  string msg_id = 1;
  string err_msg = 2;
  CallRpc event = 3;
}

message Notify {
  string entity_id = 1;
  CallRpc event = 2;
}

message Msg {
  oneof payload {
    Request req = 1;
    Response rsp = 2;
    Notify notify = 3;
    HeartBeats heart_beats = 4;
  }
}