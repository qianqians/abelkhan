syntax = "proto3"; 

message CallRpc {
  string proto_name = 1;
  bytes content = 2;
}

message HeartBeats {
}

message Request {
  string msg_id = 1;
  CallRpc event = 2;
}

message Response {
  string msg_id = 1;
  string err_msg = 2;
  CallRpc event = 3;
}

message Notify {
  CallRpc event = 1;
}

message Msg {
  oneof payload {
    Request req = 1;
    Response rsp = 2;
    Notify notify = 3;
    HeartBeats heart_beats = 4;
  }
}

message MailAttachment {
  string item_id = 1;
  uint32 count = 2;
}

message MailInfo {
  string mail_id = 1;
  string title = 2;
  string content = 3;
  uint64 create_time = 4;
  bool pop_up = 5;
  string sender = 6;
  repeated MailAttachment attachments = 7;
}
