syntax = "proto3"; 

message CallRpc {
  string protoName = 1;
  bytes content = 2;
}

message Request {
  string uuid = 1;
  CallRpc event = 2;
}

message Response {
  string errMsg = 1;
  bytes content = 2;
}

message Notify {
  CallRpc event = 1;
}

message HeartBeats {
}

message VersionHandshake {
  uint32 minVersion = 1;
  uint32 maxVersion = 2;
}